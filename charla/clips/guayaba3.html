const grid = document.getElementById('grid');
items.forEach(([cap, joke, svg], i) => {
  const r = Math.floor(i / 5), c = r === 2 ? (i % 5) + 1 : i % 5;
  const x = 20 + c * 312, y = 128 + r * 256;
  const t = i < 11 ? 1.6 + i * 1.5 : (i === 11 ? 18.3 : 19.3);
  const rot = [-2, 1.5, -1, 2, -1.5][(i * 3) % 5];
  const dark = i === 11;
  grid.insertAdjacentHTML('beforeend', `
    <div class="card panel" data-pop="${t}" data-rot="${rot}" style="left:${x}px; top:${y}px; ${dark ? 'background:#1B1A2E; justify-content:center' : ''}">

  if (joke) document.getElementById('jokes').insertAdjacentHTML('beforeend', `<div class="joke bubble hand" data-pop="${t + 0.55}" data-rot="${rot * -2}" style="${c === 4 ? 'right:14px' : `left:${x + 110}px`}; top:${y - 16}px">${joke}</div>`);

// Sacudida al "CRAC".
window.extra = t => {
  const k = t > 22.4 && t < 23.4 ? Math.sin(t * 90) * 10 * (23.4 - t) : 0;

};

<!-- INTRO: fotos reales + guayaba, antes del clip original -->

<script>
// La intro dura INTRO segundos; después corre el clip original sin cambios (desfasado).
const INTRO = 6.5;
const original = window.render;
const intro = document.getElementById('intro');
window.render = t => {
  const out = clamp((t - (INTRO - 0.5)) / 0.5);
  intro.style.opacity = 1 - out;
  intro.style.display = t >= INTRO ? 'none' : 'block';
  intro.querySelectorAll('[data-ipop]').forEach(el => {
    const a = Number(el.dataset.ipop), rot = Number(el.dataset.rot || 0);
    const p = clamp((t - a) / 0.45);
    el.style.opacity = clamp(p * 3);
    el.style.transform = `rotate(${rot}deg) scale(${0.3 + 0.7 * backOut(p)})`;
  });
  original(Math.max(0, t - INTRO));
  if (t < INTRO) document.body.style.transform = '';
};
</script>
