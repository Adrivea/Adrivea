<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../clips/common.css">
<style>
  html, body { width: 1600px; height: 900px; background: transparent; }
  .paper { position: absolute; background: repeating-linear-gradient(135deg, #FFF6E5 0 36px, #FBEFD6 36px 72px); background-attachment: fixed; }
  #frame { position: absolute; left: 494px; top: 94px; width: 1072px; height: 784px; border: 6px solid #1B1A2E; border-radius: 10px; box-shadow: 12px 12px 0 #1B1A2E; }
</style></head>
<body>
<!-- papel alrededor del hueco del video (500,100,1060x772) -->
<div class="paper" style="left:0; top:0; width:1600px; height:100px"></div>
<div class="paper" style="left:0; top:872px; width:1600px; height:28px"></div>
<div class="paper" style="left:0; top:100px; width:500px; height:772px"></div>
<div class="paper" style="left:1560px; top:100px; width:40px; height:772px"></div>
<div id="frame"></div>
<div class="abs bang pill" id="pill" style="left:40px; top:26px; font-size:30px; letter-spacing:3px">ASÍ SE VE DE VERDAD</div>
<div class="abs bang" id="tag" style="left:40px; top:150px; font-size:46px; color:#C23A1E"></div>
<div class="abs bang" id="title" style="left:40px; top:210px; width:430px; font-size:66px; line-height:1; color:#1B1A2E; text-shadow:4px 4px 0 #FFD23F"></div>
<div class="abs bubble hand" id="note" style="left:40px; top:560px; width:420px; font-size:38px; line-height:1.1; transform:rotate(-2deg)"></div>
<div class="abs bang" id="speed" style="left:40px; top:770px; font-size:32px; background:#FFD23F; border:4px solid #1B1A2E; padding:4px 18px; box-shadow:5px 5px 0 #1B1A2E"></div>
<script>
const q = new URLSearchParams(location.search);
if (q.get("pill")) document.getElementById("pill").textContent = q.get("pill");
for (const k of ["tag", "title", "note", "speed"]) document.getElementById(k).textContent = q.get(k) || '';
if (!q.get('speed')) document.getElementById('speed').style.display = 'none';
</script>
</body></html>
